name: Check latest code

on:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: "✅ Check (fmt → lint → typecheck)"
        run: deno task check

      - name: "🧪 Run unit tests"
        run: deno task test
        
      - name: "🏗️ Build project"
        run: deno task build
